<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#f3ece0" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Deep archival obsidian stock + subtle architectural grid -->
  <rect width="1500" height="500" fill="#100e0c"/>
  <rect width="1500" height="500" fill="url(#grid)"/>

  <!-- Structural ledger frame rails -->
  <line x1="0" y1="60" x2="1500" y2="60" stroke="#f3ece0" stroke-opacity=".13"/>
  <line x1="0" y1="440" x2="1500" y2="440" stroke="#f3ece0" stroke-opacity=".13"/>
  <line x1="384" y1="60" x2="384" y2="440" stroke="#f3ece0" stroke-opacity=".13"/>
  <line x1="848" y1="60" x2="848" y2="440" stroke="#f3ece0" stroke-opacity=".13"/>

  <!-- Top rail telemetry -->
  <circle cx="64" cy="31" r="4" fill="#b8d897"/>
  <text x="78" y="36" font-family="Consolas, Courier New, monospace" font-size="14" letter-spacing="2.5" fill="#b4a898">PUBLIC TESTNET · SHA-256 POW</text>
  <text x="1440" y="36" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="14" letter-spacing="2.5" fill="#7b7166">TALLYCHAIN.ORG</text>

  <!-- Upper-left archival stamp (sits cleanly above X circular avatar) -->
  <text x="60" y="106" font-family="Consolas, Courier New, monospace" font-size="12" letter-spacing="2.5" fill="#7b7166">SPECIFICATION</text>
  <text x="60" y="134" font-family="Consolas, Courier New, monospace" font-size="19" fill="#f3ece0">tally.tx.v1</text>
  <line x1="60" y1="154" x2="210" y2="154" stroke="#e58333" stroke-opacity=".65"/>
  <text x="60" y="180" font-family="Consolas, Courier New, monospace" font-size="13" fill="#b4a898">ed25519 + SHA-256(memo)</text>

  <!-- Center-left editorial headline (100% clear of X avatar on desktop & mobile) -->
  <text x="424" y="124" font-family="Consolas, Courier New, monospace" font-size="13" letter-spacing="3" fill="#f0c399">A PAYMENT IS A RECEIPT</text>
  <text x="420" y="224" font-family="Georgia, Times New Roman, serif" font-size="82" fill="#f3ece0" letter-spacing="-2">Both halves</text>
  <text x="420" y="310" font-family="Georgia, Times New Roman, serif" font-style="italic" font-size="84" fill="#f0c399" letter-spacing="-1">match.</text>
  <text x="424" y="366" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#b4a898">A chat can be cropped. A block cannot.</text>
  <rect x="424" y="388" width="182" height="30" rx="3" fill="#181410" stroke="#f3ece0" stroke-opacity=".22"/>
  <text x="515" y="408" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" letter-spacing="1" fill="#f3ece0">tallychain.org</text>

  <!-- Right column: Split Tally Voucher Specimen -->
  <g transform="translate(884 88)">
    <rect width="556" height="324" rx="4" fill="#0b0a08" stroke="#f3ece0" stroke-opacity=".24"/>
    <!-- Voucher top header bar -->
    <rect width="556" height="36" rx="4" fill="#181410"/>
    <line x1="0" y1="36" x2="556" y2="36" stroke="#f3ece0" stroke-opacity=".13"/>
    <text x="18" y="23" font-family="Consolas, Courier New, monospace" font-size="12" letter-spacing="1.5" fill="#b4a898">RECEIPT VOUCHER · BLOCK #458</text>
    <text x="538" y="23" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12" letter-spacing="1.5" fill="#f0c399">CUT ONCE</text>

    <!-- Left half: STOCK · PAYER -->
    <text x="22" y="68" font-family="Consolas, Courier New, monospace" font-size="11" letter-spacing="2" fill="#f0c399">STOCK · PAYER</text>
    <text x="22" y="118" font-family="Georgia, Times New Roman, serif" font-size="44" fill="#f3ece0">1.25</text>
    <text x="116" y="116" font-family="Consolas, Courier New, monospace" font-size="13" fill="#7b7166">tTALLY</text>
    <rect x="22" y="136" width="226" height="36" fill="#15120f"/>
    <line x1="22" y1="136" x2="22" y2="172" stroke="#e58333" stroke-width="2.5"/>
    <text x="34" y="159" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#f3ece0">for the field report</text>
    <text x="22" y="202" font-family="Consolas, Courier New, monospace" font-size="11.5" fill="#7b7166">from  tally18x9d…p2Ff</text>
    <text x="22" y="222" font-family="Consolas, Courier New, monospace" font-size="11.5" fill="#7b7166">sig   ed25519 · client</text>

    <!-- Center Split-Tally Seam -->
    <rect x="266" y="36" width="24" height="226" fill="#15120f"/>
    <line x1="266" y1="36" x2="266" y2="262" stroke="#e58333" stroke-opacity=".32" stroke-dasharray="4 4"/>
    <line x1="290" y1="36" x2="290" y2="262" stroke="#e58333" stroke-opacity=".32" stroke-dasharray="4 4"/>
    <path d="M278 36 L278 72 L270 90 L286 112 L271 136 L285 160 L270 184 L286 208 L278 228 L278 262" fill="none" stroke="#e58333" stroke-width="1.8"/>

    <!-- Right half: FOIL · PAYEE -->
    <text x="310" y="68" font-family="Consolas, Courier New, monospace" font-size="11" letter-spacing="2" fill="#f0c399">FOIL · PAYEE</text>
    <text x="310" y="118" font-family="Georgia, Times New Roman, serif" font-size="44" fill="#f3ece0">1.25</text>
    <text x="404" y="116" font-family="Consolas, Courier New, monospace" font-size="13" fill="#7b7166">tTALLY</text>
    <rect x="310" y="136" width="224" height="36" fill="#15120f"/>
    <line x1="310" y1="136" x2="310" y2="172" stroke="#e58333" stroke-width="2.5"/>
    <text x="322" y="159" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#f3ece0">for the field report</text>
    <text x="310" y="202" font-family="Consolas, Courier New, monospace" font-size="11.5" fill="#7b7166">to    tally14m2k…V5qf</text>
    <text x="310" y="222" font-family="Consolas, Courier New, monospace" font-size="11.5" fill="#7b7166">notch 8d15194e…8a2e36</text>

    <!-- Bottom verification bar -->
    <line x1="0" y1="262" x2="556" y2="262" stroke="#f3ece0" stroke-opacity=".13"/>
    <rect x="16" y="275" width="524" height="34" rx="3" fill="#b8d897" fill-opacity=".09" stroke="#b8d897" stroke-opacity=".36"/>
    <text x="30" y="297" font-family="Consolas, Courier New, monospace" font-size="12" letter-spacing="1.2" fill="#b8d897">● BOTH HALVES MATCH</text>
    <text x="526" y="297" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="11.5" fill="#b4a898">SHA-256 &amp; ED25519 VERIFIED</text>
  </g>
</svg>
